AWSTemplateFormatVersion: "2010-09-09"
Description: >
  The public site at the apex of a Route 53 domain, with www sending you to it: the landing page
  (docs/landing.html) at /, and the Tour (docs/index.html) at /about. A private S3 bucket holds the page; CloudFront serves it over HTTPS with a free ACM
  certificate; Route 53 points the domain at CloudFront. Deploy it in us-east-1 (CloudFront only
  takes certificates from there): scripts/site.sh setup does this for you.

Parameters:
  DomainName:
    Type: String
    Default: outpostmae.app
    Description: The domain the page lives at (the apex of the hosted zone). www.<domain> redirects to it.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The Route 53 hosted zone for DomainName (scripts/site.sh looks it up).

Resources:
  # The page's files. Private: only this CloudFront distribution can read them.
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: drop-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadsThePage
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # HTTPS for the domain and www. DNS validation: CloudFormation writes the check records into the
  # hosted zone itself, so this finishes on its own (usually a few minutes).
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # www.<domain>/anything → https://<domain>/anything, at the edge. And a page's address without
  # .html is the page: /about is about.html. (The name stays: renaming it would replace it.)
  WwwRedirect:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-www-redirect"
      AutoPublish: true
      FunctionConfig:
        Comment: Send www to the bare domain; /about is about.html
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var req = event.request;
          var host = req.headers.host ? req.headers.host.value : '';
          if (host.indexOf('www.') === 0) {
            var qs = Object.keys(req.querystring).map(function (k) {
              var v = req.querystring[k];
              return v.value ? k + '=' + v.value : k;
            }).join('&');
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${DomainName}' + req.uri + (qs ? '?' + qs : '') } }
            };
          }
          var uri = req.uri;
          if (uri.length > 1 && uri.split('/').pop().indexOf('.') < 0) {
            req.uri = uri.replace(/\/+$/, '') + '.html';
          }
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Landing page and Tour for ${DomainName}"
        Enabled: true
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100   # North America and Europe edges: the cheapest; others still get served
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6            # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy (HSTS, nosniff, …)
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirect.FunctionMetadata.FunctionARN
        # A path that isn't there: S3 answers 403 (CloudFront can't list the bucket). Show the page, as a 404.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60

  # The domain and www, IPv4 and IPv6, all pointing at CloudFront. Other names in the zone
  # (mae.<domain> for the relay, outposts' subdomains, mail) are left alone.
  ApexA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # every CloudFront distribution's alias zone
        EvaluateTargetHealth: false
  ApexAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # every CloudFront distribution's alias zone
        EvaluateTargetHealth: false
  WwwA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # every CloudFront distribution's alias zone
        EvaluateTargetHealth: false
  WwwAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # every CloudFront distribution's alias zone
        EvaluateTargetHealth: false

Outputs:
  BucketName:
    Description: Where scripts/site.sh deploy puts the page
    Value: !Ref SiteBucket
  DistributionId:
    Description: The CloudFront distribution (deploys clear its cache)
    Value: !Ref Distribution
  DistributionDomain:
    Description: CloudFront's own address for the site (works before DNS does)
    Value: !GetAtt Distribution.DomainName
  Url:
    Value: !Sub "https://${DomainName}/"
