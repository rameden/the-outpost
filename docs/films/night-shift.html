<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outpost Night Shift</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 16:9 stage that plays a night shift as a loop. You switch it on in Settings and choose the
   hours. A window on the outpost goes from dusk to night; once the outpost has sat idle, the shift drafts and
   reports, one row at a time. In the morning the window gives way to the card on your Today page.
   A plain transport bar sits under the stage.
   Colours, type, the logo and the dashed route are Outpost's own. */
:root {
  --page: #f0e8da; --bg: #f5efe4; --surface: #fffcf6; --surface-2: #f0e8da; --border: #e2d7c5; --border-strong: #cdbfa8;
  --text: #2a231c; --muted: #5d5247; --faint: #72675b;
  --accent: #9e5c0c; --accent-ink: #fffaf2;
  --good: #397034; --good-soft: #e1eedb; --bad: #a94630; --bad-soft: #f5dfd8;
  --c-qm: #9e5c0c; --c-scout: #3f7d3a; --c-scribe: #6a55c9; --c-art: #b4572a; --c-warden: #3d5f9e; --c-pilot: #9b4ea3;
  --ink: #2a231c; --night: #201a14; --night-text: #efe7da; --night-muted: #a3968a; --night-line: #3a322a; --night-good: #93c47d;
  --shade: rgba(60, 40, 20, .13); --sky: #1d2b4c;
  --logo-ink: #14233F; --logo-dot: #B97A12; --logo-stroke: 4; --on-light: 1; --on-dark: 0;
  --display: "Young Serif", "Iowan Old Style", Palatino, Georgia, serif;
  --body: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0b0a; --bg: #13110f; --surface: #1b1815; --surface-2: #24201b; --border: #312b25; --border-strong: #453d34;
    --text: #efe7da; --muted: #ab9f93; --faint: #90867b;
    --accent: #f0a640; --accent-ink: #1b1308;
    --good: #93c47d; --good-soft: #1f2a1b; --bad: #e88468; --bad-soft: #33201a;
    --c-qm: #f0a640; --c-scout: #93c47d; --c-scribe: #ada2f2; --c-art: #e8935f; --c-warden: #8fb0ea; --c-pilot: #d79be0;
    --ink: #efe7da; --night: #0d0b0a; --night-text: #efe7da; --night-muted: #a3968a; --night-line: #2b2520; --night-good: #93c47d;
    --shade: rgba(0, 0, 0, .5); --sky: #111c38;
  --logo-ink: #F3EDE0; --logo-dot: #D9982B; --logo-stroke: 3; --on-light: 0; --on-dark: 1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0b0a; --bg: #13110f; --surface: #1b1815; --surface-2: #24201b; --border: #312b25; --border-strong: #453d34;
  --text: #efe7da; --muted: #ab9f93; --faint: #90867b;
  --accent: #f0a640; --accent-ink: #1b1308;
  --good: #93c47d; --good-soft: #1f2a1b; --bad: #e88468; --bad-soft: #33201a;
  --c-qm: #f0a640; --c-scout: #93c47d; --c-scribe: #ada2f2; --c-art: #e8935f; --c-warden: #8fb0ea; --c-pilot: #d79be0;
  --ink: #efe7da; --night: #0d0b0a; --night-text: #efe7da; --night-muted: #a3968a; --night-line: #2b2520; --night-good: #93c47d;
  --shade: rgba(0, 0, 0, .5); --sky: #111c38;
  --logo-ink: #F3EDE0; --logo-dot: #D9982B; --logo-stroke: 3; --on-light: 0; --on-dark: 1;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.stage { aspect-ratio: 16 / 9; max-width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer; box-shadow: 0 16px 40px var(--shade); }
.stage svg { display: block; width: 100%; height: 100%; }
.controls { display: flex; align-items: center; gap: 14px; min-width: 0; }
.controls button { font: 600 13px var(--body); color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 14px; cursor: pointer; min-width: 68px; }
.controls button:hover { border-color: var(--accent); }
.controls input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
.controls output { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }

/* Stage drawing */
#stage text { user-select: none; -webkit-user-select: none; pointer-events: none; white-space: pre; }
.d { font-family: var(--display); } .b { font-family: var(--body); } .m { font-family: var(--mono); }
.f-text { fill: var(--text); } .f-muted { fill: var(--muted); } .f-faint { fill: var(--faint); }
.f-accent { fill: var(--accent); } .f-ink { fill: var(--ink); } .f-accent-ink { fill: var(--accent-ink); } .f-tone { fill: var(--tone); }
.f-good { fill: var(--good); } .f-bad { fill: var(--bad); }
.c-qm { --tone: var(--c-qm); } .c-scout { --tone: var(--c-scout); } .c-scribe { --tone: var(--c-scribe); } .c-art { --tone: var(--c-art); } .c-warden { --tone: var(--c-warden); } .c-pilot { --tone: var(--c-pilot); } .c-you { --tone: var(--muted); }
.bgfill { fill: var(--bg); }
.contour { fill: none; stroke: var(--border-strong); stroke-width: 1.2; opacity: .5; vector-effect: non-scaling-stroke; }
.contour.lit { stroke: var(--accent); stroke-width: 1.8; opacity: 0; }
.ping { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
/* The system: orbits, the tail a planet leaves, and the sun's compass. Strokes keep their width under the camera. */
.sorbit { fill: none; stroke: var(--border-strong); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.sorbit.tone { stroke: var(--tone); stroke-width: 2; }
.ptrail { fill: none; stroke: var(--tone); stroke-width: 3.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.sun-glyph * { fill: none; stroke: var(--accent-ink); stroke-width: .62; stroke-linecap: round; stroke-linejoin: round; }
.moon { fill: var(--tone); }
.body-name { font-size: 28px; fill: var(--tone); }
/* The findings list in a wide view, and the captions beside the system. The row being worked has a solid 2px border. */
.fbox { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
.frow.on .fbox { stroke: var(--accent); stroke-width: 2; }
.ctl { font-size: 11.5px; fill: var(--muted); }
.lhead { font-size: 11px; letter-spacing: .12em; fill: var(--accent); }
.wcap { font-size: 36px; fill: var(--ink); }
.code-s { font-size: 11.5px; }
.pill-a { fill: var(--surface-2); stroke: var(--accent); stroke-width: 1; }
.orbit { fill: none; stroke: var(--border-strong); stroke-width: 1.5; stroke-dasharray: 3 7; stroke-linecap: round; }
.comet { fill: var(--tone); }
.shadow { filter: drop-shadow(0 12px 22px var(--shade)); }
.card { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
.inset { fill: var(--bg); stroke: var(--border); stroke-width: 1; }
.hr { stroke: var(--border); stroke-width: 1; }
.wm-word { font-size: 158px; font-weight: 700; letter-spacing: -.01em; fill: var(--logo-ink); }
/* The mark, from the logo kit: navy on light with 4-unit arcs, cream on dark with 3-unit arcs */
.mk-solid { fill: var(--logo-ink); }
.mk-arc { fill: none; stroke: var(--logo-ink); stroke-width: var(--logo-stroke); }
.mk-arc.small { stroke-width: 8; }
.mk-arc.on-light { opacity: var(--on-light); } .mk-arc.on-dark { opacity: var(--on-dark); }
.mk-dot { fill: var(--logo-dot); }
.mk-ripple { fill: none; stroke: var(--logo-dot); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.name-w { font-size: 72px; fill: var(--ink); } .name-w.name-i { fill: var(--accent); }
.name-sub { font-size: 19px; fill: var(--muted); }
.eyebrow { font-size: 13px; letter-spacing: .14em; fill: var(--accent); }
.tagline { font-size: 44px; }
.cmd-box { fill: var(--night); stroke: var(--night-line); }
.cmd-t { font-size: 14px; fill: var(--night-text); }
.cmd-t .p { fill: var(--night-muted); }
.scene-l { font-size: 12px; letter-spacing: .12em; fill: var(--faint); }
.cap { font-size: 42px; fill: var(--ink); }
/* Route bar: the tour's numbered pins and dashed trail */
.pin { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5; transition: fill .25s, stroke .25s; }
.pin-n { font-size: 12px; fill: var(--faint); transition: fill .25s; }
.stop-l { font-size: 12px; letter-spacing: .12em; fill: var(--faint); transition: fill .25s; }
.stop.on .pin { fill: var(--accent); stroke: var(--accent); }
.stop.on .pin-n { fill: var(--accent-ink); }
.stop.on .stop-l { fill: var(--text); }
.dash { stroke-width: 2; stroke-dasharray: 6 6; }
.dash.base { stroke: var(--border-strong); }
.dash.fill { stroke: var(--accent); }
/* Crew badges */
.disc { fill: var(--surface-2); stroke: var(--tone); stroke-width: calc(var(--sw, 2) * 1px); }
.glyph * { fill: none; stroke: var(--tone); stroke-width: calc(var(--sw, 2) * .8px); stroke-linecap: round; stroke-linejoin: round; }
.pulse { fill: none; stroke: var(--tone); stroke-width: 2; vector-effect: non-scaling-stroke; }
.camp-l { font-size: 11px; letter-spacing: .14em; fill: var(--faint); }
/* Cards and the workbench */
.who { font-size: 14px; font-weight: 700; }
.t13 { font-size: 13px; } .t15 { font-size: 15px; } .t16 { font-size: 16px; } .w6 { font-weight: 600; }
.lbl { font-size: 11px; letter-spacing: .12em; fill: var(--faint); }
.code { font-size: 13px; }
.key-t { font-size: 12.5px; fill: var(--text); }
.tk-title { font-size: 27px; fill: var(--ink); }
.cb { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5; }
.cb-on { fill: var(--accent); }
.cb-check { fill: none; stroke: var(--accent-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.caret { fill: var(--accent); }
.btn-accent { fill: var(--accent); }
.btn-ghost { fill: none; stroke: var(--border-strong); }
.btn-t { font-size: 14px; font-weight: 600; }
.bubble { font-size: 17px; fill: var(--muted); }
.row-n { font-size: 12px; fill: var(--faint); }
.row-dot { fill: var(--tone); }
.row-name { font-size: 15px; font-weight: 700; fill: var(--tone); }
.row-task { font-size: 15px; fill: var(--muted); }
.ripple { fill: none; stroke: var(--accent); stroke-width: 2; }
.ph-name { font-size: 16px; font-weight: 700; }
.ph-sub { font-size: 12px; fill: var(--faint); }
.q-st { font-size: 11px; fill: var(--faint); }
.hl { fill: none; stroke: var(--tone); stroke-width: 2; }
.bg-del { fill: var(--bad-soft); } .bg-add { fill: var(--good-soft); }
.night-t { fill: var(--night-text); } .night-m { fill: var(--night-muted); } .night-good { fill: var(--night-good); }
.night-check { fill: none; stroke: var(--night-good); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pill { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1; }
.pill-t { font-size: 10.5px; letter-spacing: .1em; fill: var(--text); }
.ok-disc { fill: var(--good); }
.ok-check { fill: none; stroke: var(--surface); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pointer { fill: var(--ink); stroke: var(--surface); stroke-width: 1.3; stroke-linejoin: round; }
/* The night shift: a switch in Settings, a window on the camp that goes from day to night and back, the rows the shift writes, and the card on the Today page. */
.t12 { font-size: 12px; }
.t19 { font-size: 19px; }
.daysky { fill: var(--surface-2); }
.sky { fill: var(--sky); }
.gnd { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5; }
.gnd-n { fill: var(--night); }
.nstar { fill: var(--night-text); }
.sunb { fill: var(--accent); }
.moonb { fill: var(--night-text); }
.sun-q * { fill: none; stroke: var(--accent-ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.topo-n { stroke: var(--night-text); }
.hill { fill: var(--surface-2); }
.hill-n { fill: var(--sky); }
.winframe { fill: none; stroke: var(--border-strong); stroke-width: 1; }
.stand { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.door { fill: var(--border-strong); }
.stand-n { fill: var(--night); }
.lamp { fill: var(--accent); }
.flame { fill: var(--accent); }
.log { stroke: var(--border-strong); stroke-width: 4; stroke-linecap: round; }
.sw { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.5; }
.sw.on { fill: var(--accent); stroke: var(--accent); }
.sw-knob { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5; }
.sw-knob.on { fill: var(--accent-ink); stroke: var(--accent-ink); }
.clock-t { font-size: 26px; fill: var(--ink); }
.st-on { fill: var(--accent); }
.zz { font-size: 12px; fill: var(--night-text); }
.spark { fill: var(--accent); }
.dot-a { fill: var(--accent); }
</style>
<style>body { margin: 0; }</style>
</head>
<body>
<main class="wrap">
  <div class="stage" id="frame">
    <svg id="stage" viewBox="0 0 1280 720" role="img" aria-label="An animated example of Outpost's night shift. You switch it on in Settings and choose its hours. The outpost goes quiet for the night. Once it has sat idle for half an hour, the night shift drafts shorter versions of two memories that are getting full, lists five old lines worth a look and notes what housekeeping could clear, in at most three small model calls. Nothing is changed. In the morning the results wait on your Today page.">
      <defs>
        <radialGradient id="glow">
          <stop offset="0" style="stop-color: var(--accent); stop-opacity: .55"></stop>
          <stop offset="1" style="stop-color: var(--accent); stop-opacity: 0"></stop>
        </radialGradient>
        <radialGradient id="dotGlow">
          <stop offset="0" style="stop-color: var(--logo-dot); stop-opacity: .55"></stop>
          <stop offset="1" style="stop-color: var(--logo-dot); stop-opacity: 0"></stop>
        </radialGradient>
      </defs>
    </svg>
  </div>
  <div class="controls">
    <button type="button" id="play">Pause</button>
    <input type="range" id="scrub" min="0" max="35.4" step="0.01" value="0" aria-label="Scrub through the animation">
    <output id="clock" for="scrub">0:00 / 0:35</output>
  </div>
  <p class="note">The night shift: off until you switch it on, then it drafts and reports while the outpost is idle. Nothing is applied, deleted or changed until you approve it. It loops, and it follows your light or dark theme. Click the stage to pause.</p>
</main>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('stage');
const DUR = 35.4, PI = Math.PI, NEVER = 1e9;

// ---- helpers ----
const el = (tag, attrs, parent, text) => {
  const n = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  (parent || svg).appendChild(n);
  return n;
};
const tx = (parent, x, y, cls, s, extra) => el('text', Object.assign({ x, y, class: cls }, extra || {}), parent, s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = {
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  out: k => 1 - Math.pow(1 - k, 3),
  in: k => k * k * k,
  back: k => 1 + 2.70158 * Math.pow(k - 1, 3) + 1.70158 * Math.pow(k - 1, 2),
  lin: k => k,
};
const seg = (t, a, b, e = ease.io) => e(clamp((t - a) / (b - a)));
// there from a to b, fading in and out over d
const span = (t, a, b, d = .4) => seg(t, a, a + d, ease.out) * (1 - seg(t, b - d, b));
const O = (n, o) => { const v = clamp(o); n.style.opacity = v.toFixed(3); n.style.visibility = v < .002 ? 'hidden' : 'visible'; };
const TR = (n, x, y, s = 1) => n.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${Math.max(0, s).toFixed(4)})`);
// a class, a text or a set of attributes, written only when it changes
const cls = (n, c) => { if (n.$c !== c) { n.$c = c; n.setAttribute('class', c); } };
const say = (n, s) => { if (n.$s !== s) { n.$s = s; n.textContent = s; } };
const put = (n, attrs) => { for (const k in attrs) n.setAttribute(k, typeof attrs[k] === 'number' ? attrs[k].toFixed(2) : attrs[k]); };
// text that types itself
const TYPERS = [];
const typer = (parent, x, y, cls, s) => { const o = { n: tx(parent, x, y, cls, ''), s, x, y, last: -1, w: 0 }; TYPERS.push(o); return o; };
const typeTo = (o, k) => {
  const n = Math.floor(o.s.length * clamp(k) + 1e-6);
  if (n !== o.last) { o.last = n; o.n.textContent = o.s.slice(0, n); o.w = n ? o.n.getComputedTextLength() : 0; }
  return o;
};
// buttons: drawn about their own centre so a press can squeeze them
function button(parent, cx, cy, w, label, kind) {
  const g = el('g', null, parent);
  const box = el('rect', { x: -w / 2, y: -18, width: w, height: 36, rx: 8, class: kind === 'ghost' ? 'btn-ghost' : 'btn-accent' }, g);
  const tn = tx(g, 0, 5, 'b btn-t ' + (kind === 'ghost' ? 'f-text' : 'f-accent-ink'), label, { 'text-anchor': 'middle' });
  return { g, box, tn, cx, cy, label, state: null };
}
function press(b, t, tc, after) {
  TR(b.g, b.cx, b.cy, 1 - .08 * Math.sin(clamp((t - tc + .1) / .3) * PI));
  const done = t >= tc;
  if (done !== b.state) { b.state = done; b.tn.textContent = done && after ? after : b.label; }
}

// ---- crew badges ----
const CREW = { qm: 'Commander', scout: 'Navigator', scribe: 'Comms Officer', art: 'Engineer', warden: 'Security Chief', pilot: 'Test Pilot' };
const GLYPH = {
  qm: g => { el('circle', { cx: 12, cy: 12, r: 9 }, g); el('path', { d: 'M15.8 8.2 L13.5 13.5 L8.2 15.8 L10.5 10.5 Z' }, g); },
  scout: g => { el('path', { d: 'M7 3.5 C16.5 6.5 16.5 17.5 7 20.5' }, g); el('path', { d: 'M7 3.5 V20.5' }, g); el('path', { d: 'M2.5 12 H20.5 M17.5 9 L20.5 12 L17.5 15' }, g); },
  scribe: g => { el('path', { d: 'M20 4 C12 4.5 7 9 6 17 C13.5 16.5 19 12 20 4 Z' }, g); el('path', { d: 'M3.8 20.2 L13 11' }, g); },
  art: g => { const r = el('g', { transform: 'rotate(40 12 12)' }, g); el('rect', { x: 5.5, y: 3.5, width: 13, height: 6.5, rx: 1.5 }, r); el('path', { d: 'M12 10 V21.5' }, r); },
  warden: g => { el('path', { d: 'M12 3 L19.5 6 V11.5 C19.5 16.2 16.4 19.4 12 21 C7.6 19.4 4.5 16.2 4.5 11.5 V6 Z' }, g); el('path', { d: 'M8.8 11.9 L11.2 14.3 L15.4 9.9' }, g); },
  pilot: g => { el('path', { d: 'M20.5 3.5 L3.5 10.5 L10.5 13.5 L13.5 20.5 Z' }, g); el('path', { d: 'M10.5 13.5 L20.5 3.5' }, g); },
};
// a badge at any size: its lines stay as heavy as they are at full size
function badge(key, parent, s = 1) {
  const g = el('g', { class: 'c-' + key }, parent), k = el('g', { transform: `scale(${s})`, style: `--sw: ${(2 / s).toFixed(2)}` }, g);
  el('circle', { r: 24, class: 'disc' }, k);
  GLYPH[key](el('g', { class: 'glyph', transform: 'translate(-14.4 -14.4) scale(1.2)' }, k));
  return g;
}

// ---- what every scene has: the logo in the corner, the film's name, a title card, captions, the route bar and a last card ----
const defs = svg.querySelector('defs');
// the kit's small mark and the name beside it (docs/brand), in the kit's own coordinates
const gLogo = el('g', { transform: 'translate(56 36) scale(.19)' });
el('path', { d: 'M100 10 A90 90 0 0 0 100 190 L100 157 A57 57 0 0 1 100 43 Z M100 53 A47 47 0 0 0 100 147 L100 130 A30 30 0 0 1 100 70 Z', class: 'mk-solid' }, gLogo);
el('path', { d: 'M100 48 A52 52 0 0 1 100 152', class: 'mk-arc small' }, gLogo);

  PLANETS.forEach(p => {
    const [x, y] = orbAt(p.orb, p.rest + p.sp * turn, ph);
    TR(p.g, x, y); O(p.g, lerp(1, .78, night)); zs(p.z, x, y, p.i);
  });
  // the fire burns down for the night; the lamp in the house is the shift at work
  const fire = first ? lerp(1, .38, seg(t, T.dusk + 2, T.dusk + 4)) : lerp(.38, 1, seg(t, T.dawn + .8, T.dawn + 2.2));
  flame.setAttribute('transform', `scale(${(fire * (1 + .07 * Math.sin(t * 13))).toFixed(3)} ${(fire * (1 + .14 * Math.sin(t * 9.1 + 1))).toFixed(3)})`);
  O(fireHalo, fire * .75);
  const work = span(t, T.shift + .3, T.done + .5, .4) * (.8 + .2 * Math.sin(t * 10) ** 2);
  O(lamp, work); O(lampHalo, work * .9);
  // the clock, and what the camp is doing
  const mins = t < T.shift ? lerp(10, 240, seg(t, T.dusk + .4, T.shift - 1.6)) : t < T.dawn ? lerp(240, 244, seg(t, T.shift + .6, T.done, ease.lin)) : lerp(245, 630, seg(t, T.dawn, T.dawn + 2.2));
  const q = t >= T.shift && t < T.dawn ? 1 : 5, m = Math.round(mins / q) * q + 21 * 60;
  say(clockT, pad2(Math.floor(m / 60) % 24) + ':' + pad2(m % 60));
  say(statusT, t < T.shift - 1.6 ? 'THE OUTPOST IS IDLE' : t < T.shift ? 'IDLE, AND INSIDE YOUR HOURS' : t < T.done ? 'THE NIGHT SHIFT IS AT WORK' : t < T.dawn + 1.4 ? 'SHIFT DONE · NOTHING CHANGED' : 'MORNING');
  cls(statusT, t >= T.shift && t < T.done ? 'm lbl st-on' : 'm lbl');

  // each row: a spark leaves the house by the chimney, the row is written, and its tag says nothing was changed
  ROWS.forEach(r => {
    const k = seg(t, r.at, r.at + .6), x0 = HOUSE[0] + 31 + dx, y0 = HOUSE[1] - 90, x1 = RX, y1 = r.y + 65, cy = Math.min(y0, y1) - 110;
    const sx = (1 - k) * (1 - k) * x0 + 2 * k * (1 - k) * ((x0 + x1) / 2) + k * k * x1, sy = (1 - k) * (1 - k) * y0 + 2 * k * (1 - k) * cy + k * k * y1;
    TR(r.spark, sx, sy); O(r.spark, k > 0 && k < 1 ? Math.min(1, k * 8, (1 - k) * 8) : 0);
    O(r.g, seg(t, r.at + .45, r.at + .8) * (1 - seg(t, T.dawn + .2, T.dawn + .7)));
    typeTo(r.typed, seg(t, r.at + .8, r.at + 1.7, ease.lin));
    put(r.caret, { x: RX + 26 + r.typed.w }); O(r.caret, t > r.at + .6 && t < r.at + 1.9 && (t * 2.4) % 1 < .6 ? 1 : 0);
    O(r.subT, seg(t, r.at + 1.75, r.at + 2.05)); O(r.pillG, seg(t, r.at + 1.85, r.at + 2.15, ease.out));
  });

  // the morning
  const up = seg(t, T.dawn + .9, T.dawn + 1.4, ease.out);
  O(gToday, up * out); gToday.setAttribute('transform', `translate(0 ${((1 - up) * 12).toFixed(2)})`);
  ITEMS.forEach((it, i) => O(it.g, seg(t, T.dawn + 1.5 + i * .35, T.dawn + 1.9 + i * .35)));
  press(bLook, t, T.look); press(bDismiss, t, NEVER);

  drawPointer(t);
}

// ---- your pointer, drawn over everything ----
const ripple = el('circle', { class: 'ripple' });
const ripple2 = el('circle', { class: 'ripple' });
const pointer = el('path', { d: 'M0 0 L0 17 L4.6 13 L7.6 19.6 L10.2 18.4 L7.3 12 L13 12 Z', class: 'pointer' });
function drawPointer(t) {
  let cur = null;
  for (const c of CLICKS) if (t >= c.t - 1 && t < c.t + .6) cur = c;
  if (!cur) { O(pointer, 0); O(ripple, 0); O(ripple2, 0); return; }
  const m = seg(t, cur.t - 1, cur.t - .12);
  TR(pointer, lerp(cur.x + 300, cur.x, m), lerp(cur.y + 130, cur.y, m) - Math.sin(m * PI) * 24, 1.5 - .18 * Math.sin(clamp((t - cur.t + .1) / .25) * PI));
  O(pointer, seg(t, cur.t - 1, cur.t - .8) * (1 - seg(t, cur.t + .35, cur.t + .6)));
  const rp = (t - cur.t) / .6, rp2 = (t - cur.t - .12) / .7;
  put(ripple, { cx: cur.x, cy: cur.y, r: lerp(12, 62, ease.out(clamp(rp))) }); O(ripple, rp > 0 && rp < 1 ? (1 - rp) * .75 : 0);
  put(ripple2, { cx: cur.x, cy: cur.y, r: lerp(12, 104, ease.out(clamp(rp2))) }); O(ripple2, rp2 > 0 && rp2 < 1 ? (1 - rp2) * .5 : 0);
}

// ---- transport ----
const playB = document.getElementById('play'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
let t = 0, last = null, playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
const two = n => String(n).padStart(2, '0'), mmss = s => Math.floor(s / 60) + ':' + two(Math.floor(s % 60));
function sync() { scrub.value = t.toFixed(2); clock.textContent = mmss(t) + ' / ' + mmss(DUR); }
function setPlaying(p) { playing = p; playB.textContent = p ? 'Pause' : 'Play'; }
playB.addEventListener('click', () => setPlaying(!playing));
document.getElementById('frame').addEventListener('click', () => setPlaying(!playing));
scrub.addEventListener('input', () => { t = clamp(parseFloat(scrub.value), 0, DUR - .001); render(t); sync(); });
function frame(now) {
  if (playing && last != null) { t = (t + Math.min(.1, (now - last) / 1000)) % DUR; render(t); sync(); }
  last = now;
  requestAnimationFrame(frame);
}
layoutRoute(); layout(); setPlaying(playing); render(0); sync();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutRoute(); layout(); TYPERS.forEach(o => { o.last = -1; }); render(t); });
requestAnimationFrame(frame);
})();
</script>
