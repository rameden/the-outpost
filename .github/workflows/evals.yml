# Runs the eval set (evals/) against the real API: by hand from the Actions tab, and once a week.
# It spends real tokens, so it runs only when the repository has an ANTHROPIC_API_KEY secret, and
# skips cleanly when it hasn't. Each case is capped at EVAL_CASE_BUDGET dollars (see evals/case.ts).
# The cases themselves are checked on every pull request without a key: tests/evals.test.ts runs
# `evals/run.ts --dry` as part of npm test.
#
# The run is compared with the committed baseline (evals/baseline.json) and the comparison is put
# in the job summary. Only a clear regression fails the job: a case whose pass rate is down by
# half or more over at least two failed trials (a case that fails once is run twice more first).
# Until a baseline is committed, a failed case fails the job, as it always did.
# To record a baseline: run this by hand with "baseline" ticked, download evals/baseline.json from
# the run's artifact, and commit it. See evals/README.md.
name: Evals

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Case ids to run, separated by spaces (empty: all of them)"
        required: false
        default: ""
      set:
        description: "Model overrides, e.g. --set scout=auto:economy (empty: the defaults)"
        required: false
        default: ""
      trials:
        description: "Times to run each case (empty: once, or 3 when recording a baseline)"
        required: false
        default: ""
      baseline:
        description: "Record a new baseline from this run (then commit evals/baseline.json from the artifact)"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC

concurrency:
  group: evals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evals:
    name: Run the evals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # A secret can't be read in a job's `if`, so this step says whether there is one.
      - name: Is there an API key?
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Evals skipped::Add an ANTHROPIC_API_KEY secret to the repository to run the evals."
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Set up git
        if: steps.key.outputs.present == 'true'
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Install
        if: steps.key.outputs.present == 'true'
        run: npm ci

      - name: Check the cases
        if: steps.key.outputs.present == 'true'
        run: npx tsx evals/run.ts --dry

      # The runner prints each case, saves the whole run to evals/results/<time>.json, compares it
      # with evals/baseline.json, and writes the comparison to the job summary. It exits 1 only on
      # a clear regression (or, with no baseline yet, on a failed case).
      - name: Run the evals and compare with the baseline
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAMP_RUNTIME: api
          CASES: ${{ github.event.inputs.cases }}
          SET: ${{ github.event.inputs.set }}
          TRIALS: ${{ github.event.inputs.trials }}
          BASELINE: ${{ github.event.inputs.baseline }}
        # Word-split on purpose: CASES is ids, SET is --set flags.
        run: |
          FLAGS="--compare"
          if [ "$BASELINE" = "true" ]; then
            FLAGS="$FLAGS --write-baseline"
            TRIALS="${TRIALS:-3}"
          fi
          if [ -n "$TRIALS" ]; then FLAGS="$FLAGS --trials $TRIALS"; fi
          npx tsx evals/run.ts $FLAGS $SET $CASES

      - name: Keep the results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_number }}
          # The runs, and the baseline as this run left it (new, when "baseline" was ticked).
          path: |
            evals/results/
            evals/baseline.json
          if-no-files-found: warn
          retention-days: 90
