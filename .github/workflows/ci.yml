# Checks every pull request, and main after a merge: the types and the whole test suite.
# It needs no secrets: the tests talk to stand-ins for the model and for Jira, never the real ones.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch replaces the run that was going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Several tests make small git repositories of their own: git needs to know who's committing
      # and what a new repository's first branch is called.
      - name: Set up git for the tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  # The same on Windows, where the camp is newer: this job shows what works there and what
  # doesn't yet, without holding up a merge. Take continue-on-error away once it stays green.
  windows:
    name: Typecheck and tests (Windows, doesn't block)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up git for the tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
